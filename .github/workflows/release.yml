# Publishes GitHub releases for Inkfold.
# • "Run workflow" on the Actions tab publishes every version that has no release yet, oldest first.
#   Each version's commit is found from the history (the last commit whose manifest has that version),
#   and its v<version> tag is created with the release.
# • Pushing a version tag (v1.9.1, …) publishes that version.
# Each release gets the extension zip built from that commit, and its notes from CHANGELOG.md.
name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: main

      - name: Publish releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # version -> commit: an existing tag, or else the last commit on main with that version
          declare -A at
          for c in $(git rev-list --reverse HEAD); do
            v=$(git show "$c:extension/manifest.json" 2>/dev/null | sed -n 's/.*"version": *"\([^"]*\)".*/\1/p' | head -1)
            [ -n "$v" ] && at[$v]=$c
          done
          for t in $(git tag -l 'v*'); do at[${t#v}]=$(git rev-list -n1 "$t"); done
          if [ "${{ github.event_name }}" = "push" ]; then
            tags="${GITHUB_REF_NAME}"
          else
            tags=$(printf 'v%s\n' "${!at[@]}" | sort -V)
          fi
          newest=$(printf 'v%s\n' "${!at[@]}" | sort -V | tail -1)
          for tag in $tags; do
            v="${tag#v}"
            if gh release view "$tag" >/dev/null 2>&1; then echo "$tag: already released"; continue; fi
            # The extension, exactly as it was at this tag
            rm -rf build && mkdir build
            git archive "${at[$v]}" extension | tar -x -C build
            (cd build/extension && zip -qr -X "../../inkfold-$v.zip" . -x '.*' -x '*/.*')
            # Title and notes from this version's CHANGELOG section ("## 1.9.0: title")
            heading=$(grep -m1 -E "^## ${v//./\\.}(:|$)" CHANGELOG.md || true)
            title="Inkfold $v"
            case "$heading" in *:*) title="Inkfold $v: ${heading#*: }";; esac
            awk -v v="$v" '/^## /{ on = ($2 == v || $2 == v":") ; next } on' CHANGELOG.md > notes.md
            if [ "$v" = "1.4.0" ]; then   # versions from before this repository
              { echo; echo '### Before 1.4.0 (as "PDF Shapes", before this repository)'; echo;
                awk '/^## 1\.3\.0/{on=1} on' CHANGELOG.md | sed 's/^## /#### /'; } >> notes.md
            fi
            { echo; echo '---'; echo;
              echo "**Install:** download \`inkfold-$v.zip\`, unzip it, open \`chrome://extensions\`, turn on **Developer mode**, click **Load unpacked** and choose the unzipped folder. The same zip is what goes to the Chrome Web Store."; } >> notes.md
            latest=false; [ "$tag" = "$newest" ] && latest=true
            gh release create "$tag" "inkfold-$v.zip" --target "${at[$v]}" --title "$title" --notes-file notes.md --latest=$latest
            echo "$tag: released"
          done
